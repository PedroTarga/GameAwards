<!DOCTYPE html>
<html lang="pt-BR" data-auth="required">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Jogos | Painel Game Awards</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="../supabase-credentials.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="./js/services/authService.js"></script>
<script src="./js/guard.js"></script>
</head>
<body>
<nav class="header-menu">
  <a class="brand" href="index.html"><img src="../assets/images/logo.webp" width="200" height="70" alt="Game Awards"></a>
  <ul class="navigation">
    <li class="item"><a class="link" href="index.html">Painel</a></li>
    <li class="item"><a class="link active" href="jogos.html" aria-current="page">Jogos</a></li>
    <li class="item"><a class="link" href="categorias.html">Categorias</a></li>
    <li class="item"><a class="link" id="logout" href="login.html">Sair</a></li>
  </ul>
</nav>
<main class="admin">
  <div class="admin-header">
    <div>
      <h1>Jogos indicados</h1>
    </div>
  </div>
  <section class="admin-panel">
  <h2>Cadastrar jogo</h2>
  <form id="form" class="admin-form">
    <div class="form-row">
      <div class="form-field"><label>Nome do jogo *<input name="nome" required maxlength="120"></label></div>
      <div class="form-field"><label>Categoria<select name="categoria_id" id="categoria"></select></label></div>
    </div>
    <div class="form-field"><label>Link da imagem (https://...)<input name="imagem_url" type="url" placeholder="https://site.com/capa.jpg"></label></div>
    <div class="form-field"><label>Descrição<textarea name="descricao" rows="3" maxlength="600"></textarea></label></div>
    <label class="form-field"><input name="destaque" type="checkbox"> Destacar na home</label>
    <button type="submit" class="call-to-action" id="salvar">Salvar jogo</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
  <h2>Jogos cadastrados</h2>
  <div class="admin-games-grid" id="lista"></div>
  </section>
</main>
<footer class="footer"><p>© 2026 Game Awards — Projeto de Desenvolvimento Web.</p></footer>
<script src="../assets/js/utils/dom.js"></script>
<script src="./js/services/categoriasService.js"></script>
<script src="./js/services/jogosService.js"></script>
<script src="./js/pages/jogos.js"></script>
</body>
</html>
