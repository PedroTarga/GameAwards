<!DOCTYPE html>
<html lang="pt-BR" data-auth="guest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Entrar | Painel Administrativo</title>
    <link rel="stylesheet" href="../assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <nav class="header-menu admin-login-header">
        <a class="brand" href="../index.html">
            <img src="../assets/images/logo.webp" width="200" height="70" alt="Game Awards">
        </a>
        <ul class="navigation">
            <li class="item">
                <a class="link" href="../index.html">Voltar para o site</a>
            </li>
        </ul>
    </nav>

    <main class="login admin-login">
        <div class="admin-login-copy">
            <p class="admin-login-label">Área administrativa</p>
            <h1>Game Awards</h1>
            <p>Gerencie os jogos e categorias indicadas.</p>
        </div>

        <div class="admin-panel">
            <h2>Entrar no painel</h2>
            <p class="feedback" id="login-feedback" role="alert" aria-live="assertive"></p>

            <form class="admin-form" id="form-login" novalidate>
                <div class="form-field">
                    <label for="campo-email">E-mail</label>
                    <input type="email" id="campo-email" name="email" placeholder="admin@gameawards.com"
                        autocomplete="username" required />
                    <span class="error">Informe o e-mail.</span>
                </div>

                <div class="form-field">
                    <label for="campo-senha">Senha</label>
                    <input type="password" id="campo-senha" name="senha" placeholder="Sua senha"
                        autocomplete="current-password" required />
                    <span class="error">Informe a senha.</span>
                </div>

                <p class="field-hint">Use o e-mail e a senha cadastrados em Authentication → Users no Supabase.</p>
                <button type="submit" class="call-to-action">Entrar</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Game Awards — Projeto de Desenvolvimento Web.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <script src="../supabase-credentials.js"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="./js/services/authService.js"></script>
    <script src="../assets/js/utils/dom.js"></script>
    <script src="./js/pages/login.js"></script>
</body>

</html>
